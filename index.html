<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f3eee3">
<title>펭귄 탐험 — 첫 구간</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #f3eee3;
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  }
  canvas { position: fixed; inset: 0; display: block; touch-action: none; }
  #safe {
    position: fixed; visibility: hidden; pointer-events: none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #reset {
    position: fixed;
    top: calc(env(safe-area-inset-top) + 12px);
    left: calc(env(safe-area-inset-left) + 14px);
    padding: 7px 12px; border: 0; border-radius: 14px;
    background: rgba(40, 40, 44, 0.12); color: #3a3a3e;
    font-size: 13px; font-family: inherit; touch-action: none;
  }
  #reset:active { background: rgba(40, 40, 44, 0.25); }
  #finish {
    position: fixed; left: 50%; top: 16%; transform: translateX(-50%); text-align: center;
    padding: 10px 22px; border-radius: 18px; background: rgba(243, 238, 227, 0.88);
    color: #2a2a2e; font-size: 20px; letter-spacing: 0.08em; white-space: nowrap;
    opacity: 0; transition: opacity 1.6s ease; pointer-events: none;
  }
  #finish small { display: block; margin-top: 6px; font-size: 13px; opacity: 0.6; letter-spacing: 0.02em; }
  #finish.show { opacity: 1; }
  #rotate {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: #f3eee3; color: #3a3a3e; font-size: 16px; text-align: center; z-index: 10;
  }
  @media (orientation: portrait) and (max-width: 820px) { #rotate { display: flex; } }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="safe"></div>
<button id="reset" type="button">처음으로</button>
<div id="finish">섬에 도착했어요<small>첫 구간 끝</small></div>
<div id="rotate">휴대폰을 가로로 돌려주세요</div>
<script src="config.js"></script>
<script src="game.js"></script>
</body>
</html>
