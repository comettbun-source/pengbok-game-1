<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0f14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400&display=swap" rel="stylesheet">
<title>펭귄 탐험 — 첫 구간 (GRIS 가로 구도)</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #0b0f14;
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  }
  canvas { position: fixed; inset: 0; display: block; touch-action: none; }
  #safe {
    position: fixed; visibility: hidden; pointer-events: none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  /* 처음으로: 반투명 + 붓글씨 느낌 한글 (Song Myung), 은은한 빛 */
  #reset {
    position: fixed;
    top: calc(env(safe-area-inset-top) + 14px);
    left: calc(env(safe-area-inset-left) + 16px);
    padding: 9px 23px 8px; border: 1px solid rgba(235, 240, 248, 0.14); border-radius: 999px;
    background: rgba(255, 255, 255, 0.05); color: rgba(236, 240, 247, 0.72);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    font-family: 'Gowun Batang', 'Nanum Myeongjo', serif; font-weight: 400; font-size: 13.5px; letter-spacing: 0.22em; line-height: 1;
    text-shadow: 0 0 10px rgba(255, 255, 255, 0.22); touch-action: none; transition: background 0.2s, color 0.2s;
  }
  #reset:active { background: rgba(255, 255, 255, 0.14); color: rgba(255, 255, 255, 0.92); }
  #rotate {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: #0b0f14; color: #c9ced6; font-size: 16px; text-align: center; z-index: 10;
  }
  @media (orientation: portrait) and (max-width: 820px) { #rotate { display: flex; } }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="safe"></div>
<button id="reset" type="button">처음으로</button>
<div id="rotate">휴대폰을 가로로 돌려주세요</div>
<script src="config_gris.js"></script>
<script src="water.js"></script>
<script src="game_gris.js"></script>
</body>
</html>
